<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>時刻通 - 邀請獎勵儀表板</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f6f8;
            color: #333;
            overflow-x: hidden;
        }

        /* 呼吸燈載入畫面 */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f5f6f8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }
        .fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .breathing-logo {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            background-color: #06C755;
            animation: breath 2s ease-in-out infinite; 
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        @keyframes breath {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }
        .loading-text {
            margin-top: 16px;
            color: #555;
            font-weight: bold;
            letter-spacing: 1px;
            animation: pulseText 2s infinite;
        }
        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* 頂部儀表板統計區塊 */
        .dashboard-header {
            background: linear-gradient(135deg, #06C755, #05a044);
            padding: 40px 20px 30px 20px;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 4px 15px rgba(6, 199, 85, 0.15);
            margin-bottom: 24px;
        }
        .dashboard-title {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }
        .stats-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 16px;
            border-radius: 16px;
            flex: 1;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .stat-label {
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            margin-bottom: 8px;
        }
        .stat-value {
            color: #ffffff;
            font-size: 32px;
            font-weight: 900;
            line-height: 1;
        }
        .stat-unit {
            font-size: 14px;
            font-weight: normal;
            margin-left: 2px;
        }

        /* 明細列表區塊 */
        .container {
            padding: 0 20px 40px 20px;
        }
        .section-title {
            font-size: 17px;
            font-weight: 800;
            color: #222;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 16px;
            background-color: #06C755;
            border-radius: 2px;
        }

        .invite-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .invite-card {
            background: #fff;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #f0f0f0;
        }
        .user-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .user-name {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
        .user-date {
            font-size: 12px;
            color: #888;
        }
        .reward-badge {
            background-color: #e6f8ec;
            color: #06C755;
            font-size: 16px;
            font-weight: 900;
            padding: 6px 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            background: #fff;
            border-radius: 14px;
            border: 1px dashed #ddd;
            font-size: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- 載入中畫面 -->
    <div id="loadingScreen">
        <div class="breathing-logo">時</div>
        <div class="loading-text" id="loadingStatus">資料同步中...</div>
    </div>

    <!-- 儀表板統計區 -->
    <div class="dashboard-header">
        <div class="dashboard-title">我的推薦獎勵儀表板</div>
        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-label">成功邀請</div>
                <div class="stat-value"><span id="total-invites">0</span><span class="stat-unit">人</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">獲得點數</div>
                <div class="stat-value"><span id="total-points">0</span><span class="stat-unit">點</span></div>
            </div>
        </div>
    </div>

    <!-- 明細清單區 -->
    <div class="container">
        <div class="section-title">邀請成功明細</div>
        <div class="invite-list" id="invite-list-container">
            <!-- 列表將由 JS 動態渲染 -->
        </div>
    </div>

    <script>
        const LIFF_ID = "2010547461-bwpc55l0"; // 請替換為您的 LIFF ID
        // n8n Webhook 網址 (對齊裂變命名)
        const FETCH_FISSION_WEBHOOK = "https://chiehworks-n8n.zeabur.app/webhook/liff-get-fission";

        let userLineId = "";

        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                const profile = await liff.getProfile();
                userLineId = profile.userId;
                
                await fetchFissionData();
            } catch (err) {
                document.getElementById('loadingStatus').innerText = "系統初始化失敗";
                alert("無法連結至 LINE，請確認網路狀態。");
            }
        }

        // 純原生 JS 日期格式化函數 (不依賴任何外部模組)
        function formatNativeDate(dateString) {
            if (!dateString) return "時間未知";
            const d = new Date(dateString);
            if (isNaN(d.getTime())) return dateString; 

            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            const hh = String(d.getHours()).padStart(2, '0');
            const min = String(d.getMinutes()).padStart(2, '0');
            
            return `${yyyy}/${mm}/${dd} ${hh}:${min}`;
        }

        async function fetchFissionData() {
            try {
                const response = await fetch(`${FETCH_FISSION_WEBHOOK}?userId=${encodeURIComponent(userLineId)}`, {
                    method: 'GET'
                });

                if (!response.ok) throw new Error("API Response Error");
                
                const result = await response.json();
                renderDashboard(result);
            } catch (error) {
                console.error("讀取資料失敗", error);
                document.getElementById('invite-list-container').innerHTML = 
                    '<div class="empty-state">網路連線異常<br>請下拉畫面重新整理</div>';
            } finally {
                // 關閉載入動畫
                document.getElementById('loadingScreen').classList.add('fade-out');
            }
        }

        function renderDashboard(data) {
            // 1. 更新統計數字
            const totalInvites = data.total_invites || 0;
            const totalPoints = totalInvites * 3; // 規則：每人 3 點
            
            // 增加數字動態遞增的效果 (視覺體驗優化)
            animateValue("total-invites", 0, totalInvites, 800);
            animateValue("total-points", 0, totalPoints, 800);

            // 2. 渲染明細清單
            const container = document.getElementById('invite-list-container');
            const list = data.invited_list || [];

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        您目前尚未成功邀請好友喔！<br>
                        趕快點擊「分享給好友」拿獎勵吧 🎁
                    </div>
                `;
                return;
            }

            let htmlString = "";
            list.forEach(item => {
                const displayName = item.Display_Name || "未命名用戶";
                const dateStr = formatNativeDate(item.Created_Time);
                
                htmlString += `
                    <div class="invite-card">
                        <div class="user-info">
                            <div class="user-name">${displayName}</div>
                            <div class="user-date">${dateStr}</div>
                        </div>
                        <div class="reward-badge">+3</div>
                    </div>
                `;
            });
            container.innerHTML = htmlString;
        }

        // 數字跳動動畫函數 (原生 JS 實作)
        function animateValue(id, start, end, duration) {
            if (start === end) {
                document.getElementById(id).innerHTML = end;
                return;
            }
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                document.getElementById(id).innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        window.addEventListener('load', initializeLiff);
    </script>
</body>
</html>
